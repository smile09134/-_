<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人隨身醫療卡 / Medical Profile</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-alt: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            padding: 20px 10px;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 24px;
            border: 1px solid var(--border);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 1.5rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .lang-select-box select {
            background-color: var(--bg-card-alt);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .emergency-banner {
            background-color: rgba(239, 68, 68, 0.15);
            border-left: 4px solid var(--accent-red);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .emergency-banner h3 {
            color: var(--accent-red);
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--bg-card-alt);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card h2 {
            font-size: 1.1rem;
            color: var(--primary-light);
            margin-bottom: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .info-row span:first-child {
            color: var(--text-muted);
        }

        .info-row span:last-child {
            font-weight: 600;
        }

        ul.list {
            list-style: none;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        ul.list li {
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
        }

        ul.list li:last-child {
            border-bottom: none;
        }

        .badge {
            background-color: var(--primary-light);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
        }

        .badge.alert {
            background-color: var(--accent-red);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 id="title">隨身醫療電子病歷</h1>
        <div class="lang-select-box">
            <select id="langSelect" onchange="changeLanguage()">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
                <option value="ja">日本語</option>
                <option value="ko">한국어</option>
                <option value="es">Español</option>
                <option value="fr">Français</option>
                <option value="de">Deutsch</option>
                <option value="pt">Português</option>
            </select>
        </div>
    </header>

    <!-- 緊急聯絡人區塊 -->
    <div class="emergency-banner">
        <h3 id="label-emergency-title">🚨 緊急聯絡資訊 (Emergency Contact)</h3>
        <div class="info-row" style="margin-top: 8px;">
            <span id="label-ice-name">聯絡人姓名</span>
            <span>廖慧真</span>
        </div>
        <div class="info-row">
            <span id="label-ice-phone">緊急電話</span>
            <span><a href="tel:0912228485" style="color: #60a5fa; text-decoration: none;">0912228485</a></span>
        </div>
    </div>

    <!-- 個人基本資料 -->
    <div class="grid-2">
        <div class="card">
            <h2 id="label-personal-info">個人基本資料</h2>
            <div class="info-row"><span id="label-name">姓名</span><span>廖緗絨</span></div>
            <div class="info-row"><span id="label-dob">出生日期</span><span>2010.09.13</span></div>
            <div class="info-row"><span id="label-gender">性別</span><span id="val-gender">女</span></div>
            <div class="info-row"><span id="label-nationality">國籍</span><span id="val-nationality">台灣</span></div>
            <div class="info-row"><span id="label-blood">血型</span><span class="badge">O 型</span></div>
            <div class="info-row"><span id="label-height">身高</span><span>164 cm</span></div>
            <div class="info-row"><span id="label-weight">體重</span><span>50 kg</span></div>
        </div>

        <!-- 醫療提醒與過敏史 -->
        <div class="card">
            <h2 id="label-alerts">關鍵醫療提醒</h2>
            <div class="info-row"><span id="label-allergy">過敏史 (Allergies)</span><span class="badge alert" id="val-allergy">無已知過敏 / NKDA</span></div>
            <div class="info-row"><span id="label-organ-donor">器官捐贈意願</span><span id="val-donor">未登記</span></div>
            <div class="info-row"><span id="label-vaccine">疫苗接種紀錄</span><span id="val-vaccine">完成基礎疫苗</span></div>
        </div>
    </div>

    <!-- 醫療歷史紀錄 -->
    <div class="grid-2">
        <div class="card">
            <h2 id="label-medical-history">個人與疾病史</h2>
            <ul class="list">
                <li id="val-history-1">個人史：無特殊重大慢性病史。</li>
                <li id="val-history-2">過去疾病史：無。</li>
            </ul>
        </div>

        <div class="card">
            <h2 id="label-family-history">家族病史</h2>
            <ul class="list">
                <li id="val-fam-1">家族遺傳疾病：無特殊紀錄。</li>
            </ul>
        </div>
    </div>

    <div class="grid-2">
        <div class="card">
            <h2 id="label-surgery">手術史</h2>
            <ul class="list">
                <li id="val-surg-1">無重大手術紀錄。</li>
            </ul>
        </div>

        <div class="card">
            <h2 id="label-medication">長期與目前用藥史</h2>
            <ul class="list">
                <li id="val-med-1">無日常長期服藥需求。</li>
            </ul>
        </div>
    </div>
</div>
